name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.100.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-go@v5
      with:
        go-version-file: tests/goredis/go.mod
        cache-dependency-path: tests/goredis/go.sum
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Run tests
      run: cargo test --locked --verbose

  tla:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [async-write, async-barrier, cluster-and-negatives, replication]

    steps:
    - uses: actions/checkout@v4
    - name: Cache tla2tools.jar
      uses: actions/cache@v4
      with:
        path: ~/.cache/tla2tools
        key: tla2tools-v1.7.4
    - name: Run TLC model checks (${{ matrix.suite }})
      run: ./specs/check.sh "${{ matrix.suite }}"
