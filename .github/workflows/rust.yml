name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: tests/goredis/go.mod
        cache-dependency-path: tests/goredis/go.sum
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
