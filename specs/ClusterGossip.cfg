SPECIFICATION Spec

CONSTANTS
    Nodes = {"n1", "n2", "n3"}
    Slots = {1, 2}
    InitOwner <- InitOwnerDef
    MaxSlotOps = 2
    MaxFaults = 1
    AllowUnservedLocalFallback = FALSE
    AllowGossipPublishRace = FALSE

INVARIANTS
    TypeOK
    SingleSlotOwner
    NoOrphanedWrites
    NoSelfRedirect

PROPERTIES
    GossipEventuallyConverges
    RoutingEventuallyAccurate
