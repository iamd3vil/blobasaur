\* Negative test: gossip overwrites slot bindings regardless of epoch, so a returning old primary takes its slots back.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 1
    MaxFaults = 1
    VolatileVotes = FALSE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = TRUE

CHECK_DEADLOCK FALSE

PROPERTIES
    TableEpochsNeverDecrease
