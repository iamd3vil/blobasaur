\* Two replicas of p1 competing, with crashes, isolation and aborted elections — safety.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 2
    MaxFaults = 1
    VolatileVotes = FALSE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OneWinnerPerEpoch
    WinnerReplacesCurrentOwner
    UniqueClaims

PROPERTIES
    TableEpochsNeverDecrease
