\* Larger bounds for local runs (about 25 minutes on 16 cores): ./specs/check.sh replication-large
SPECIFICATION Spec

CONSTANTS
    Keys = {"k1", "k2"}
    Values = {"v1", "v2"}
    MaxWrites = 3
    MaxFaults = 2
    PageRows = 1
    ChanCap = 1
    UpsertKeepsLsn = FALSE
    NoAutoincrement = FALSE
    TrimIgnoresPins = FALSE
    SkipTrimmedThroughCheck = FALSE
    NoReplidRotation = FALSE
    CommitAfterCleanMarker = FALSE
    VolatileStartupMarker = FALSE
    ReplicaCursorNotAtomic = FALSE

INVARIANTS
    TypeOK
    CaughtUpMeansEqual
    ReplicaNeverAhead
    LsnsUnique
    SyncedMeansCaughtUp
    PagesMatchReplid
    StreamImpliesConnection

PROPERTIES
    ReplicaEventuallyConverges
