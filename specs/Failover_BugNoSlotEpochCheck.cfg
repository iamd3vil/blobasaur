\* Negative test: a primary votes without checking the request's slot epochs against its table.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 2
    MaxFaults = 1
    VolatileVotes = FALSE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = TRUE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    WinnerReplacesCurrentOwner
