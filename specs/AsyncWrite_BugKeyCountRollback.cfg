\* Negative test: applies batch_delta on a failed/rolled-back batch to confirm TLC catches key_count drift.
SPECIFICATION Spec

CONSTANTS
    Keys = {"k1"}
    Values = {"v1"}
    InitVal = "v0"
    Clients = {"c1"}
    MaxTime = 0
    BatchSize = 2
    QueueCap = 2
    MaxOps = 1
    AllowExpireInflightUpdate = TRUE
    AllowExpireBatchBarrier = TRUE
    AllowBatchFailure = TRUE
    ExpireUpdatesFiniteTtl = FALSE
    ReadTsAfterCacheMiss = FALSE
    EnableCleanup = FALSE
    CleanupSkipsInflight = TRUE
    ApplyDeltaOnFailure = TRUE

INVARIANTS
    TypeOK
    KeyCountAccurate
