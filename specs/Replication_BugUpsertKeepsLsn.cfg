\* Negative test: ON CONFLICT DO UPDATE keeps a rewritten key's LSN, so a replica past it never gets the new value.
SPECIFICATION Spec

CONSTANTS
    Keys = {"k1"}
    Values = {"v1", "v2"}
    MaxWrites = 2
    MaxFaults = 1
    PageRows = 1
    ChanCap = 1
    UpsertKeepsLsn = TRUE
    NoAutoincrement = FALSE
    TrimIgnoresPins = FALSE
    SkipTrimmedThroughCheck = FALSE
    NoReplidRotation = FALSE
    CommitAfterCleanMarker = FALSE
    VolatileStartupMarker = FALSE
    ReplicaCursorNotAtomic = FALSE

INVARIANTS
    TypeOK
    CaughtUpMeansEqual
