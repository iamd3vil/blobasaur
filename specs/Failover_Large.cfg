\* Larger bounds for local runs (about 30 minutes on 16 cores): ./specs/check.sh failover-large
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 2
    MaxFaults = 2
    VolatileVotes = FALSE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OneWinnerPerEpoch
    WinnerReplacesCurrentOwner
    UniqueClaims

PROPERTIES
    TableEpochsNeverDecrease
