\* Negative test: a commit after clean_shutdown = 1 is lost on power loss, but the marker keeps the replid.
SPECIFICATION Spec

CONSTANTS
    Keys = {"k1", "k2"}
    Values = {"v1", "v2"}
    MaxWrites = 2
    MaxFaults = 2
    PageRows = 1
    ChanCap = 1
    UpsertKeepsLsn = FALSE
    NoAutoincrement = FALSE
    TrimIgnoresPins = FALSE
    SkipTrimmedThroughCheck = FALSE
    NoReplidRotation = FALSE
    CommitAfterCleanMarker = TRUE
    VolatileStartupMarker = FALSE
    ReplicaCursorNotAtomic = FALSE

INVARIANTS
    TypeOK
    CaughtUpMeansEqual
