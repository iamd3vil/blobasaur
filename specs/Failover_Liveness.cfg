\* p1 may crash for good; its replica must take over and the cluster converge.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {"p1"}
    MaxEpoch = 3
    MaxFaults = 2
    VolatileVotes = FALSE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OneWinnerPerEpoch
    WinnerReplacesCurrentOwner
    UniqueClaims

PROPERTIES
    TableEpochsNeverDecrease
    EventuallyConverges
