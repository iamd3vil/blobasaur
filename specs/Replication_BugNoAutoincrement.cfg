\* Negative test: repl_log without AUTOINCREMENT reuses the LSN of a trimmed tombstone, which a replica's cursor already passed.
SPECIFICATION Spec

CONSTANTS
    Keys = {"k1", "k2"}
    Values = {"v1", "v2"}
    MaxWrites = 4
    MaxFaults = 1
    PageRows = 1
    ChanCap = 1
    UpsertKeepsLsn = FALSE
    NoAutoincrement = TRUE
    TrimIgnoresPins = FALSE
    SkipTrimmedThroughCheck = FALSE
    NoReplidRotation = FALSE
    CommitAfterCleanMarker = FALSE
    VolatileStartupMarker = FALSE
    ReplicaCursorNotAtomic = FALSE

INVARIANTS
    TypeOK
    CaughtUpMeansEqual
