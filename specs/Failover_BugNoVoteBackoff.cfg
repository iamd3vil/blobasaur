\* Negative test: a primary votes again for another replica of the same primary before the first winner's claim reaches it.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 2
    MaxFaults = 1
    VolatileVotes = FALSE
    NoVoteBackoff = TRUE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    WinnerReplacesCurrentOwner
