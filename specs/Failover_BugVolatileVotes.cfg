\* Negative test: votes and the vote backoff are lost on restart, so a primary votes twice in one epoch and two replicas win it.
SPECIFICATION Spec

CONSTANTS
    Primaries = {"p1", "p2", "p3"}
    Replicas = {"r1", "r2"}
    FailedPrimary = "p1"
    Slots = {"s1", "s2", "s3"}
    InitOwner <- InitOwnerDef
    Permanent = {}
    MaxEpoch = 1
    MaxFaults = 3
    VolatileVotes = TRUE
    NoVoteBackoff = FALSE
    NoSlotEpochCheck = FALSE
    TableIgnoresEpoch = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    OneWinnerPerEpoch
